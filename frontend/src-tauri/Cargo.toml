[package]
name = "csstatsradar-desktop"
version = "2.3.0"
description = "Lightweight Tauri shell for CSStatsRadar (spawns the .NET sidecar)"
authors = ["CSStatsRadar contributors"]
edition = "2021"

[lib]
name = "csstatsradar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
