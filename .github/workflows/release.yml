name: Release

# 按 v* tag 触发：在 Windows runner 上构建 .NET 8 自包含应用，
# 打包为 zip 后发布为 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Publish .NET app (Windows x64, self-contained)
        run: |
          dotnet publish src/Radar.App/Radar.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish
        shell: pwsh

      - name: Copy frontend dist to publish output
        shell: pwsh
        run: |
          Copy-Item -Path frontend/dist -Destination publish/dist -Recurse

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "CSPlayerStatsRadar-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: CSPlayerStatsRadar-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
