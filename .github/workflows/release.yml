name: Release (legacy Radar.App zip)

# 旧版浏览器壳（Radar.App）打包流程，仅作为手动回退通道保留。
# 正式的 v* tag 发布已切换到 desktop.yml（Tauri NSIS 安装包），
# 这里不再监听 tag，避免同一 tag 产出两个 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如 v2.3.0），用于产物命名与 Release tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Publish .NET app (Windows x64, self-contained)
        run: |
          dotnet publish src/Radar.App/Radar.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish
        shell: pwsh

      - name: Copy frontend dist to publish output
        shell: pwsh
        run: |
          Copy-Item -Path frontend/dist -Destination publish/dist -Recurse

      - name: Create zip archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "CSPlayerStatsRadar-${{ inputs.version }}-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: CSPlayerStatsRadar-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: artifacts/*
