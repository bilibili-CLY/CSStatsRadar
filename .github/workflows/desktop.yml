name: Desktop

# 桌面发布链（Tauri 壳 + Kestrel sidecar + 内嵌 FFmpeg）。
# - 分支 / PR 触发：只做校验与构建，不产出 Release。
# - 推送 v* tag：构建 NSIS 安装包并发布为 GitHub Release。
on:
  push:
    branches:
      - main
      - 'refactor/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate dev path (backend tests + frontend build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # LargeBridgePayloadTests.Full_VideoExport_Encode_And_Download 会真实调用 ffmpeg 编码，
      # 缺 ffmpeg 会让整套校验（以及依赖它的 NSIS 构建）失败。
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Backend tests
        run: dotnet test src/Radar.Tests --nologo -v q

      - name: Frontend build and tests
        working-directory: frontend
        run: |
          npm ci
          npm run stamp:versions
          npm run build
          npm run test

  build-windows-nsis:
    name: Build Windows NSIS (Tauri + sidecar + FFmpeg)
    runs-on: windows-latest
    needs: validate
    env:
      VITE_CS_RADAR_URL: http://127.0.0.1:19871
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg (Chocolatey)
        run: choco install ffmpeg --no-progress -y

      # chocolatey 的 bin\ffmpeg.exe 只是 shim 代理壳（几百 KB），真身在 lib\ffmpeg\tools\ 下。
      # 内嵌进安装包的必须是真身：目标机上没有 chocolatey，shim 就是一个死文件。
      - name: Resolve real FFmpeg binary
        shell: pwsh
        run: |
          $ff = Get-ChildItem "$env:ProgramData\chocolatey\lib\ffmpeg\tools" -Recurse -Filter ffmpeg.exe |
            Where-Object { $_.Length -gt 20MB } | Select-Object -First 1
          if (-not $ff) { throw "real ffmpeg.exe not found under chocolatey lib\tools" }
          "CS_RADAR_FFMPEG_EXE=$($ff.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ("ffmpeg: {0} ({1:N1} MiB)" -f $ff.FullName, ($ff.Length / 1MB))
          & $ff.FullName -version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp versions
        working-directory: frontend
        run: npm run stamp:versions

      - name: Stage Tauri resources (sidecar + FFmpeg)
        working-directory: frontend
        run: npm run stage:resources

      - name: Runtime size budget
        working-directory: frontend
        run: npm run report:size

      - name: Build Tauri NSIS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          includeUpdaterJson: false

      # 回归护栏：bundle.resources 若用 glob（如 "staged/*"），Tauri 会跳过 glob 命中的目录，
      # 静默只打进零散文件，安装包缩水成 ~10 MiB 的空壳。低于 30 MiB 一定是没打全。
      - name: Verify installer payload
        shell: pwsh
        run: |
          $setup = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $mib = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "installer: $($setup.Name) ($mib MiB)"
          if ($setup.Length -lt 30MB) {
            throw "installer is only $mib MiB - bundled resources (sidecar / FFmpeg) are most likely missing"
          }

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build-windows-nsis
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: artifacts

      - name: List release assets
        run: ls -la artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.exe
